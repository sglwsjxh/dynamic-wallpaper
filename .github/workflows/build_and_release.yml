name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            git

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles"
          cmake --build build --config Release

      - name: Package Release
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp build/wallpaper.exe release/
          cp build/libmpv-2.dll release/
          cp README.md release/
          cp README-en.md release/
          cp LICENSE release/
          cp config.example.json release/
          cp -r LICENSES release/

      - name: Create Zip
        shell: pwsh
        run: |
          Compress-Archive -Path release/* -DestinationPath dynamic-wallpaper-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dynamic-wallpaper-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false